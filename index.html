<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운동기록">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>풀업 · 푸쉬업</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:650px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:4px 0 18px}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:15px;box-shadow:0 2px 12px #0001}
h2{font-size:18px;margin:0 0 13px}label{display:block;font-size:13px;color:#666;margin:9px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#18181b;color:#fff;font-size:16px;font-weight:700;margin-top:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f6f6f7;border-radius:13px;padding:13px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#777}
.entry{border-top:1px solid #eee;padding:12px 0}.entry:first-child{border-top:0}.date{font-size:12px;color:#777}.del{float:right;background:#eee;color:#555;padding:5px 9px;width:auto;margin:0;font-size:12px}
.chart{height:210px;display:flex;align-items:flex-end;gap:8px;padding:10px 2px 0}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar{width:100%;min-height:3px;border-radius:7px 7px 2px 2px;background:#18181b}.bar2{background:#888}.day{font-size:10px;color:#777;margin-top:5px}.legend{text-align:center;font-size:12px;color:#666}.empty{text-align:center;color:#999;padding:20px}
</style></head><body><div class="app">
<h1>💪 풀업 · 푸쉬업</h1>
<div class="card"><h2>오늘 운동 기록</h2><div class="row">
<div><label>운동</label><select id="type"><option>풀업</option><option>푸쉬업</option></select></div>
<div><label>날짜</label><input id="date" type="date"></div></div>
<div class="row"><div><label>횟수 (1세트)</label><input id="reps" type="number" min="1" placeholder="10"></div>
<div><label>세트 수</label><input id="sets" type="number" min="1" placeholder="3"></div></div>
<button onclick="add()">기록 저장</button></div>
<div class="card"><h2>현재 상황</h2><div class="stats">
<div class="stat"><span>오늘 풀업</span><b id="todayPull">0</b><span>회</span></div>
<div class="stat"><span>오늘 푸쉬업</span><b id="todayPush">0</b><span>회</span></div>
<div class="stat"><span>총 풀업</span><b id="allPull">0</b><span>회</span></div>
<div class="stat"><span>총 푸쉬업</span><b id="allPush">0</b><span>회</span></div></div></div>
<div class="card"><h2>최근 7일 운동량</h2><div class="chart" id="chart"></div><div class="legend">검정 = 풀업　회색 = 푸쉬업</div></div>
<div class="card"><h2>기록 목록</h2><div id="list"></div></div>
</div>
<script>
const KEY="pp_pwa_v1";let records=JSON.parse(localStorage.getItem(KEY)||"[]");date.value=new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function add(){let r={id:Date.now(),date:date.value,type:type.value,reps:+reps.value||0,sets:+sets.value||0};if(!r.reps||!r.sets){alert("횟수와 세트 수를 입력해주세요.");return}records.unshift(r);save();reps.value="";sets.value=""}
function total(t,d){return records.filter(r=>r.type===t&&(!d||r.date===d)).reduce((s,r)=>s+r.reps*r.sets,0)}
function removeRecord(id){records=records.filter(r=>r.id!==id);save()}
function render(){
let today=new Date().toISOString().slice(0,10);todayPull.textContent=total("풀업",today);todayPush.textContent=total("푸쉬업",today);allPull.textContent=total("풀업");allPush.textContent=total("푸쉬업");
list.innerHTML=records.length?records.map(r=>`<div class="entry"><button class="del" onclick="removeRecord(${r.id})">삭제</button><b>${r.type}</b> · ${r.reps}회 × ${r.sets}세트 = <b>${r.reps*r.sets}회</b><div class="date">${r.date}</div></div>`).join(""):'<div class="empty">아직 기록이 없습니다.</div>';
let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
let v=days.map(d=>({d,p:total("풀업",d),q:total("푸쉬업",d)})),max=Math.max(1,...v.map(x=>Math.max(x.p,x.q)));
chart.innerHTML=v.map(x=>`<div class="col"><div style="display:flex;align-items:end;gap:3px;width:70%;height:170px"><div style="flex:1;height:100%;display:flex;align-items:end"><div class="bar" style="height:${Math.max(2,x.p/max*155)}px"></div></div><div style="flex:1;height:100%;display:flex;align-items:end"><div class="bar bar2" style="height:${Math.max(2,x.q/max*155)}px"></div></div></div><div class="day">${x.d.slice(5)}</div></div>`).join("")
}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));render();
</script></body></html>
